name: Validate Workflow

on:
  workflow_dispatch:
    inputs:
      pool-tag:
        description: 'The pool tag to use for the validation job'
      package-id:
        description: 'The package ID to use for the validation job'

permissions: {}
concurrency:
    group: ${{ github.ref_name }}
    cancel-in-progress: true

jobs:
  validate:
    uses: navikt/crm-workflows-base/.github/workflows/validate.yml@458cc725b822532a601914101e3b7ba8368b7e51
    with:
      pool-tag: ${{ github.event.inputs.pool-tag }}
      package-id: ${{ github.event.inputs.package-id }}
    secrets:
      PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}