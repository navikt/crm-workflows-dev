name: Validate Workflow

on:
  workflow_dispatch:
    inputs:
      pool-tag:
        description: 'The pool tag to use for the validation job'

permissions: {}
concurrency:
    group: ${{ github.ref_name }}
    cancel-in-progress: true

jobs:
  validate:
    uses: navikt/crm-workflows-base/.github/workflows/validate.yml@9ed26a5f3c62a52a45e2245acdfacebde98c02bf
    with:
      pool-tag: ${{ github.event.inputs.pool-tag }}
    secrets:
      DEV_HUB_SFDX_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
      PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
    permissions:
      contents: read # Required to read repository contents for validation
      packages: read # Required to read package information for validation