name: Validate Workflow

on:
  workflow_dispatch:
    inputs:
      pool-tag:
        description: 'The pool tag to use for the validation job'

permissions: {}
concurrency:
    group: ${{ github.ref_name }}
    cancel-in-progress: true

jobs:
  validate:
    uses: navikt/crm-workflows-base/.github/workflows/validate.yml@9fdb562e6a26bb7c671bf23b18794a5ecb282121
    with:
      pool-tag: ${{ github.event.inputs.pool-tag }}
    secrets:
      DEV_HUB_SFDX_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
      PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
    permissions:
      contents: read # Required to read repository contents for validation
      packages: read # Required to read package information for validation
      pull-requests: write # Required to add Pull Request comments from static code validation
      security-events: write # Required to create and manage security events (static code validation)