name: Validate Workflow

on:
  push:
  workflow_dispatch:
    inputs:
      pool-tag:
        description: "The pool tag to use for the validation job"
        required: true
        default: "ci-test"
      run-all-validations:
        description: "Whether to run all validations"
        required: true
        default: "false"

permissions: {}
concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    uses: navikt/crm-workflows-base/.github/workflows/validate.yml@09fd05e58a83575cd486ee6c50f1ca17ed74c0bf
    with:
      pool-tag: ${{ github.event.inputs.pool-tag }} || 'ci-test'
      run-all-validations: ${{ github.event.inputs.run-all-validations }} || 'false'
    secrets:
      DEV_HUB_SFDX_URL: ${{ secrets.CRM_PROD_SFDX_URL }}
      PACKAGE_KEY: ${{ secrets.CRM_PACKAGE_KEY }}
    permissions:
      contents: read # Required to read repository contents for validation
      packages: read # Required to read package information for validation
      pull-requests: write # Required to add Pull Request comments from static code validation
      security-events: write # Required to create and manage security events (static code validation)
